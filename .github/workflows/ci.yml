name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build
        run: cargo build

      - name: Build with hot-reload feature
        run: cargo build --features hot-reload

      - name: Test
        run: cargo test --workspace

      - name: Lint
        run: cargo clippy --workspace -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  lua:
    name: Lua
    runs-on: ubuntu-latest

    steps:
      - name: Install luacheck
        run: |
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint
        run: luacheck ./lua

  proto:
    name: Proto
    runs-on: ubuntu-latest

    steps:
      - name: Install protolint
        run: |
          protolint_version="0.57.0"
          protolint_archive="protolint_${protolint_version}_linux_amd64.tar.gz"
          protolint_sha256="ad8a340427a14f035c4ff8ee81d532467ea15b5a80fb02ad1529a01e1d945f47"
          protolint_download="${RUNNER_TEMP}/${protolint_archive}"

          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 \
            "https://github.com/yoheimuta/protolint/releases/download/v${protolint_version}/${protolint_archive}" \
            --output "$protolint_download"
          printf '%s  %s\n' "$protolint_sha256" "$protolint_download" | sha256sum --check -
          tar -xzf "$protolint_download" -C "$HOME/.local/bin" protolint
          "$HOME/.local/bin/protolint" --version

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint
        run: protolint lint protos/.

  linux:
    name: Linux
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Builds on Linux
        run: cargo clippy --workspace -- -D warnings
